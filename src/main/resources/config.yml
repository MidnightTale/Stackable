debug: false

# Rank perk mode
# false = base "items" apply to everyone; stackable.use is ignored
# true  = base items require an explicit stackable.use permission
#         hoppers/world skip player-only stack sizes
#         groups still use stackable.group.<name>
require-permission: false

# Base stacks (everyone, or stackable.use when require-permission is true)
# Always quote wildcard keys (YAML treats bare * specially).
items:
  suspicious_stew: 32
  rabbit_stew: 32
  mushroom_stew: 32
  beetroot_soup: 32

  potion: 8
  splash_potion: 8
  lingering_potion: 8

  "*_boat": 4
  "*_chest_boat": 4
  "*_raft": 4
  "*_chest_raft": 4

  "*minecart": 4

  saddle: 16

  # Matches undyed SHULKER_BOX and all colored *_SHULKER_BOX
  "*_shulker_box": 64

  # All music discs (music_disc_cat, music_disc_creator_music_box, ...)
  "music_disc_*": 16

# Per-rank stack tiers.
# Grant the permission to a LuckPerms group. Highest matching size wins.
# Default permission node: stackable.group.<name> (override with "permission:")
#
# Example LuckPerms:
#   /lp group vip permission set stackable.group.vip true
#   /lp group mvp permission set stackable.group.mvp true
groups:
  # vip:
  #   items:
  #     potion: 16
  #     splash_potion: 16
  #     lingering_potion: 16
  #     saddle: 32
  # mvp:
  #   items:
  #     potion: 32
  #     splash_potion: 32
  #     lingering_potion: 32
  #     "*_boat": 8
  #     saddle: 64
