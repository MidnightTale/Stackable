name: Stackable
version: '${version}'
main: net.hynse.stackable.Stackable
api-version: '1.21'
folia-supported: true
commands:
  stackablereload:
    description: Reloads the Stackable plugin configuration
    usage: /stackablereload
    permission: stackable.reload
  stackabletest:
    description: Test wildcard patterns against material names
    usage: /stackabletest <pattern> [material]
    permission: stackable.admin
permissions:
  stackable.use:
    description: Allows base custom stack sizes from the items section
    default: false
  stackable.reload:
    description: Allows reloading the Stackable configuration
    default: op
  stackable.admin:
    description: Full Stackable admin command access
    default: op
    children:
      stackable.reload: true
  stackable.group.*:
    description: Rank stack tiers (stackable.group.<name> nodes are registered from config at runtime)
    default: false
